# HAProxy in front of the GlassFish cluster (ADR-011). Readiness comes from /health/ready, which the
# Atlas traffic module only reports UP once the instance is validated, and DOWN as soon as it drains.
global
    log stdout format raw local0 info
    stats socket "${ATLAS_HAPROXY_SOCKET}" mode 600 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client  60s
    timeout server  60s
    # If a request still reaches a draining instance after its grace period (503) or the connection
    # fails, send it to another server. Only replayable requests are retried.
    retries 2
    option redispatch 1
    retry-on conn-failure empty-response 503

frontend atlas
    bind "${ATLAS_HAPROXY_BIND}"
    # Never replay a request that may have changed state on the server: a POST cut in flight and sent
    # again to another instance executes the business operation twice (findings H-12)
    acl idempotent method GET HEAD OPTIONS
    http-request disable-l7-retry if !idempotent
    default_backend glassfish

backend glassfish
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    # Probes go to the dedicated health listener (own thread pool), never queued behind business requests
    timeout check 2s
    # DOWN after 2 failed probes (~2 s, below the default 5 s drain grace); UP after 2 good ones
    default-server inter 1s fall 2 rise 2
    server i1 127.0.0.1:28080 check port 28090
    server i2 127.0.0.1:29080 check port 29090

listen stats
    bind "${ATLAS_HAPROXY_STATS}"
    stats enable
    stats uri /stats
